[project]
name = "axon-api"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg",
    "fastapi",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "redis",
    "sqlalchemy[asyncio]",
    "uvicorn",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
