[project]
name = "axon"
version = "0.0.0"
requires-python = "==3.12.*"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "services/engine", "services/worker"]

[dependency-groups]
dev = ["httpx", "mypy", "pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "engine", "worker"]

[tool.ruff.lint.per-file-ignores]
"services/*/tests/**" = ["S603", "S607"]
"services/engine/engine_tests/**" = ["S314"]  # parses our own XML output
"scripts/**" = ["S603", "S607", "S310"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "services/api,services/engine,services/worker"
explicit_package_bases = true
files = ["services/api/app", "services/api/migrations", "services/api/tests", "services/engine/engine", "services/engine/engine_tests", "services/worker/worker", "scripts", "conftest.py"]

# Pipecat is only partly typed: allow calling its untyped functions and decorators from the engine.
[[tool.mypy.overrides]]
module = ["engine.*", "engine_tests.*"]
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/engine/engine_tests"]
# Explicit so tests never depend on editable-install .pth files (macOS may flag them hidden).
pythonpath = ["services/api", "services/engine", "services/worker"]
addopts = "-p pytester"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:'audioop' is deprecated:DeprecationWarning",
    # Pipecat 1.x deprecations we keep on purpose (see engine/call.py).
    "ignore:`PipelineTask` is deprecated:DeprecationWarning",
    "ignore:`PipelineRunner` is deprecated:DeprecationWarning",
]
markers = ["requires_keys(*keys): needs real vendor keys; skipped while any named key is unset"]
