# Production overrides for one Linux VM (Mumbai region). Use with the development file:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build --wait
# Only Caddy is published (80 and 443, with TLS certificates from Let's Encrypt). Postgres, Redis,
# the API, the engine and the web server stay on Compose's private network.
# See docs/runbooks/deploy.md.

x-prod-env: &prod-env
  DATABASE_URL: postgresql+asyncpg://axon:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/axon
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0

x-prod: &prod
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *prod
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: !reset []

  redis:
    <<: *prod
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports: !reset []

  migrate:
    environment: *prod-env

  api:
    <<: *prod
    environment:
      <<: *prod-env
      # The API is reachable only through Caddy and the web server on the private network, so
      # forwarded client addresses can be trusted. Never publish port 8000 with this set.
      FORWARDED_ALLOW_IPS: "*"
    ports: !reset []

  engine:
    <<: *prod
    environment:
      <<: *prod-env
      FORWARDED_ALLOW_IPS: "*"
    ports: !reset []

  worker:
    <<: *prod
    environment: *prod-env

  web:
    <<: *prod
    ports: !reset []

  caddy:
    <<: *prod
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      AXON_APP_DOMAIN: ${AXON_APP_DOMAIN:?set AXON_APP_DOMAIN in .env}
      AXON_ENGINE_DOMAIN: ${AXON_ENGINE_DOMAIN:?set AXON_ENGINE_DOMAIN in .env}
      AXON_ACME_EMAIL: ${AXON_ACME_EMAIL:?set AXON_ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      engine: { condition: service_healthy }

  # One dump a day, kept for 14 days in deploy/backups, encrypted to the owner's gpg public key
  # before it touches the disk (gpg is already in this image), so the VM cannot read its own
  # backups. Copy the folder off the machine as well (docs/runbooks/backup-restore.md): a backup
  # on the same disk does not survive losing the VM.
  backup:
    <<: *prod
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      PGUSER: axon
      PGDATABASE: axon
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./backup-public-key.asc:/backup-key.asc:ro # the owner's; its private half stays off the VM
    entrypoint: ["bash", "/backup.sh"]
    configs: [{ source: backup_script, target: /backup.sh }]
    depends_on:
      postgres: { condition: service_healthy }

configs:
  backup_script:
    content: |
      set -uo pipefail
      umask 077
      export GNUPGHOME="$$(mktemp -d)"
      while true; do
        name="/backups/axon-$$(date -u +%Y%m%dT%H%M%SZ).dump.gpg"
        if pg_dump -Fc | gpg --batch --yes --trust-model always \
            --recipient-file /backup-key.asc --encrypt --output "$$name.part"; then
          mv "$$name.part" "$$name" && echo "backup written: $$name"
        else
          rm -f "$$name.part"
          echo "backup FAILED, nothing kept: is deploy/backup-public-key.asc a gpg public key?" >&2
        fi
        find /backups -name 'axon-*.dump*' -mtime +$$KEEP_DAYS -exec rm -f {} +
        sleep 86400
      done

volumes:
  caddy_data:
  caddy_config:
