# Browser security headers for the dashboard (HSTS is Caddy's job: it holds the TLS). Included in
# every location of nginx.conf that sets headers of its own, since nginx drops inherited headers
# there. The script hash is the inline theme script in apps/web/index.html; the test
# test_security_headers.py fails if they drift. Engine WebSockets (browser test calls) may be on
# any host here (a tunnel in development); Caddy narrows that in production.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-E5+0y76WvthX/sSQDLNCy4EcueuQ6IcbP6zCIDq6Vwg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
