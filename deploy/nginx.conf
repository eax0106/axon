map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m; # the API refuses bodies over 10 MB anyway

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h; # live-call WebSockets stay open for the whole call
  }

  # Hashed file names: safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes all serve the app; the shell itself is never cached stale.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
