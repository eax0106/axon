name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - uses: ikalnytskyi/action-setup-postgres@10ab8a56cc77b4823c2bfa57b1d4dd5605ef0481 # v7
        with:
          username: axon
          password: axon
          database: postgres
          port: 5432
          postgres-version: "16"
      # Redis for the live-event tests; there is no native Redis on Windows runners, so they skip there.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y redis-server
      - if: runner.os == 'macOS'
        run: brew install redis && brew services start redis
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -p no:cacheprovider -rs
        env:
          AXON_TEST_DATABASE_URL: postgresql+asyncpg://axon:axon@localhost:5432/postgres
          AXON_TEST_REDIS_URL: ${{ runner.os != 'Windows' && 'redis://localhost:6379/5' || '' }}

  compose:
    name: compose (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - run: uv run python scripts/compose_smoke.py --down
