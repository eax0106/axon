name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - uses: ikalnytskyi/action-setup-postgres@10ab8a56cc77b4823c2bfa57b1d4dd5605ef0481 # v7
        with:
          username: axon
          password: axon
          database: postgres
          port: 5432
          postgres-version: "16"
      # Redis for the live-event tests; there is no native Redis on Windows runners, so they skip there.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y redis-server
      - if: runner.os == 'macOS'
        run: brew install redis && brew services start redis
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -p no:cacheprovider -rs
        env:
          AXON_TEST_DATABASE_URL: postgresql+asyncpg://axon:axon@localhost:5432/postgres
          AXON_TEST_REDIS_URL: ${{ runner.os != 'Windows' && 'redis://localhost:6379/5' || '' }}

  web:
    name: web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter web size

  # The committed OpenAPI document and the TS types made from it must match the API.
  contracts:
    name: contracts (fresh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @axon/contracts
      - run: uv sync --locked --all-packages
      - run: uv run python scripts/export_openapi.py
      - run: pnpm --filter @axon/contracts gen
      - run: git diff --exit-code -- packages/contracts

  compose:
    name: compose (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # Sign-up needs a JWT secret; a throwaway one for this run only, never committed. The e2e
      # flows sign up more accounts from one address than the 10-an-hour limit allows, so this
      # throwaway stack runs with the auth limits off (they have their own backend tests).
      - run: printf 'AXON_JWT_SECRET=%s\nAXON_AUTH_RATE_LIMIT=off\n' "$(openssl rand -hex 32)" > .env
      - run: uv run python scripts/compose_smoke.py
      # End-to-end through the served dashboard, against the stack the smoke test just started.
      - run: pnpm install --frozen-lockfile --filter web...
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  # Known-vulnerability scan of the locked dependencies. It never blocks a merge: a new advisory
  # on an old dependency is not this change's fault. Read it, and update the lock when it names one.
  audit:
    name: audit (dependencies)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - run: uv audit --locked --preview-features audit-command
